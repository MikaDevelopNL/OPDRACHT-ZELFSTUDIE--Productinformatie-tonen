<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Productinformatie tonen</title>
		<link rel="stylesheet" href="style.css"/>
	</head>
	<body>
		<header>
			<h1>BikePoint</h1>
		</header>
		<main>
			<div class="product-container">
				<div class="product">
					<h2 class="bike-title">Gazelle Ultimate C8</h2>
					<p class="bike-info">Een comfortabele en betrouwbare stadsfiets, ideaal voor dagelijks gebruik en langere fietstochten.</p>
					<div class="product-bottem">
						<button type="button" class="btn">Meer informatie...</button>
						<p class="price">€249,99</p>
					</div>
				</div>
				
				<div class="product">
					<h2 class="bike-title">Trek Marlin 7</h2>
					<p class="bike-info">Een sportieve mountainbike met stevige banden en een goede vering, geschikt voor ruige paden en bosritten.</p>
					<div class="product-bottem">
						<button type="button" class="btn">Meer informatie...</button>
						<p class="price">€199,99</p>
					</div>
				</div>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
